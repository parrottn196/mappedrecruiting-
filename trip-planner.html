<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>The Recruiting Trail — MappedRecruiting</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
:root{--bg:#070907;--panel:#0c110c;--line:#d4af37;--text:#f3ead1;--muted:#9a9178}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;font-family:Georgia,serif;background:var(--bg);color:var(--text)}
body{overflow:auto}
.bar1{display:flex;align-items:center;justify-content:space-between;gap:.7rem;padding:.55rem 1rem;border-bottom:1px solid rgba(212,175,55,.22);flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:.6rem}
.ga{width:34px;height:34px;border:1.5px solid var(--line);border-radius:50%;display:grid;place-items:center;color:var(--line);font-size:.7rem}
.logo h1{font-size:.74rem;letter-spacing:.16em;color:var(--line)}
.logo p{font-size:.6rem;letter-spacing:.08em;color:var(--muted)}
.nav{display:flex;gap:.45rem;flex-wrap:wrap}
a.board{color:var(--line);text-decoration:none;letter-spacing:.12em;font-size:.62rem;border:1px solid rgba(212,175,55,.35);padding:.42rem .55rem;white-space:nowrap}
a.board.on{color:#1a1608;background:var(--line);border-color:var(--line)}
main{display:grid;grid-template-columns:minmax(280px,420px) 1fr;min-height:calc(100vh - 62px)}
.left,.right{padding:1rem;overflow:auto}
.right{border-left:1px solid rgba(212,175,55,.22);background:radial-gradient(circle at 20% 0%,#162016,var(--panel) 55%)}
.kicker{font-size:.62rem;letter-spacing:.18em;color:var(--line);margin-bottom:.45rem}
.search,select,input[type=text]{width:100%;background:#101510;border:1px solid rgba(212,175,55,.35);color:var(--text);padding:.48rem .7rem;font:inherit}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:.45rem;margin:.55rem 0 .7rem}
.school{display:grid;grid-template-columns:1fr auto;gap:.4rem;padding:.7rem 0;border-bottom:1px dashed rgba(212,175,55,.28)}
.n{font-size:.92rem}
.sub{color:var(--muted);font-size:.72rem;margin-top:.15rem}
.btn{background:#101510;border:1px solid rgba(212,175,55,.35);color:var(--muted);padding:.38rem .5rem;font:inherit;letter-spacing:.1em;font-size:.62rem;cursor:pointer}
.btn.on{color:#1a1608;background:var(--line);border-color:var(--line)}
.title{font-size:1.35rem;letter-spacing:.08em;margin:.15rem 0 .8rem}
.start{display:flex;align-items:center;gap:.6rem;margin-bottom:.85rem}
.start .pin{width:28px;height:28px;border-radius:50%;background:var(--line);color:#1a1608;display:grid;place-items:center;font-size:.8rem;flex:none}
.loop{margin-left:auto;display:flex;align-items:center;gap:.4rem;color:var(--muted);font-size:.72rem;letter-spacing:.08em;white-space:nowrap}
.stop{display:grid;grid-template-columns:36px 1fr auto;gap:.55rem;padding:.7rem 0;border-bottom:1px dashed rgba(212,175,55,.28)}
.num{width:28px;height:28px;border-radius:50%;background:var(--line);color:#1a1608;display:grid;place-items:center;font-weight:700;font-size:.8rem}
.mi{color:var(--line);font-size:.78rem;text-align:right}
.tools{display:flex;flex-direction:column;gap:.25rem}
#map{height:190px;margin:.8rem 0 1rem;border:1px solid rgba(212,175,55,.28);background:#070907}
.summary{border:1px solid var(--line);padding:.75rem;margin-top:.4rem}
.summary p{font-size:.86rem;margin-bottom:.65rem}
.actions{display:flex;flex-wrap:wrap;gap:.45rem}
.actions a,.actions button{color:var(--line);text-decoration:none;border:1px solid rgba(212,175,55,.35);padding:.4rem .55rem;font-size:.72rem;background:none;font:inherit;cursor:pointer}
.empty{color:var(--muted);padding:1rem 0}
.warn{color:#e2c56a;font-size:.72rem;margin:.35rem 0}
@media(max-width:900px){
  main{grid-template-columns:1fr}
  .right{border-left:0;border-top:1px solid rgba(212,175,55,.22)}
}
@media print{
  .bar1,.left,.actions,.loop,button,.tools{display:none!important}
  .right{border:0;background:#fff;color:#111}
  .n,.title{color:#111}
}
</style>
</head>
<body>
<header class="bar1">
  <div class="logo"><div class="ga">GA</div><div><h1>MAPPEDRECRUITING</h1><p>GHSA 2026–28 TRIP PLANNER</p></div></div>
  <nav class="nav">
    <a class="board" href="index.html">MAP</a>
    <a class="board" href="our-recruits.html">OUR RECRUITING BOARD</a>
    <a class="board on" href="trip-planner.html">TRIP PLANNER</a>
  </nav>
</header>
<main>
  <section class="left">
    <div class="kicker">ADD SCHOOLS</div>
    <input id="q" class="search" placeholder="Search school, city, or county"/>
    <div class="filters">
      <select id="cls"><option value="">All classes</option><option>7A</option><option>6A</option><option>5A</option><option>4A</option><option>3A</option><option>2A</option><option>A</option></select>
      <select id="cty"><option value="">All counties</option></select>
    </div>
    <div id="results"></div>
  </section>
  <section class="right">
    <div class="kicker">TRIP</div>
    <input id="tripName" class="title" type="text" value="THE RECRUITING TRAIL"/>
    <div class="start" style="margin-top:.8rem">
      <div class="pin">●</div>
      <div style="flex:1">
        <div class="kicker">START / END</div>
        <input id="start" type="text" placeholder="City, address, or campus"/>
        <button class="btn" id="hereBtn" type="button" style="margin-top:.35rem">USE MY LOCATION</button>
      </div>
      <label class="loop"><input id="loop" type="checkbox" checked/> Return home</label>
    </div>
    <div id="map"></div>
    <div id="stops"></div>
    <div class="summary">
      <p id="stats">0 stops</p>
      <p class="warn" id="warn" hidden>Google Maps allows about 10 stops per link. Extra stops stay on this page.</p>
      <div class="actions">
        <a id="gmaps" href="#" target="_blank" rel="noopener">Open in Google Maps</a>
        <a id="amaps" href="#" target="_blank" rel="noopener">Apple Maps</a>
        <button type="button" id="copyBtn">Copy link</button>
        <button type="button" id="printBtn">Print sheet</button>
        <button type="button" id="optBtn">Optimize order</button>
        <button type="button" id="clearBtn">Clear trip</button>
      </div>
    </div>
  </section>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
