<!DOCTYPE html>
<html lang="en">
<head>

  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <style>
    :root {
      --bg: #070907;
      --panel: #101410;
      --line: #d4af37;
      --text: #f3ead1;
      --muted: #9a9178;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Georgia, "Times New Roman", serif; background: var(--bg); color: var(--text); }
    header {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 1rem;
      align-items: center;
      padding: .85rem 1.1rem;
      border-bottom: 1px solid rgba(212,175,55,.25);
    }
    .logo { display: flex; align-items: center; gap: .65rem; white-space: nowrap; }
    .ga {
      width: 36px; height: 36px; border: 1.5px solid var(--line); border-radius: 50%;
      display: grid; place-items: center; color: var(--line); font-size: .72rem; letter-spacing: .04em;
    }
    .logo h1 { font-size: .78rem; letter-spacing: .16em; color: var(--line); font-weight: 600; }
    .logo p { font-size: .62rem; letter-spacing: .08em; color: var(--muted); }
    .search {
      width: 100%; max-width: 420px;
      background: #0c100c; border: 1px solid rgba(212,175,55,.35); color: var(--text);
      padding: .55rem .8rem .55rem 2rem; border-radius: 4px; font: inherit;
    }
    .search-wrap { position: relative; }
    .search-wrap:before { content: "⌕"; position: absolute; left: .6rem; top: .42rem; color: var(--line); }
    .filters { display: flex; gap: .7rem; align-items: end; font-size: .68rem; color: var(--muted); letter-spacing: .06em; }
    .filters label { display: grid; gap: .2rem; }
    .filters select {
      background: transparent; color: var(--text); border: 0; border-bottom: 1px solid rgba(212,175,55,.35);
      padding: .2rem 1.1rem .2rem 0; font: inherit;
    }
    .layout { display: grid; grid-template-columns: 1.15fr .85fr; min-height: calc(100vh - 68px); }
    #map { background: #070907; min-height: 560px; }
    .leaflet-container { background: #070907; }
    .leaflet-tile-pane { filter: brightness(1.35) contrast(1.05); }
    .hint-map { position: absolute; left: 14px; bottom: 12px; z-index: 500; color: var(--muted); font-size: .72rem; }
    .drawer { padding: 1rem; }
    .card {
      background: #0e130e; border: 1px solid rgba(212,175,55,.28); border-radius: 10px; padding: 1rem;
      min-height: calc(100vh - 100px);
    }
    .top { display: grid; grid-template-columns: 92px 1fr; gap: .85rem; }
    .photo {
      height: 92px; border: 1px solid rgba(212,175,55,.3); border-radius: 8px;
      display: grid; place-items: center; color: var(--muted); font-size: .62rem; letter-spacing: .08em; text-align: center;
    }
    .badge { display: inline-block; border: 1px solid var(--line); color: var(--line); font-size: .62rem; padding: .15rem .4rem; margin-top: .35rem; }
    .loc { color: var(--muted); font-size: .82rem; margin-top: .35rem; }
    .block { margin-top: 1rem; color: var(--muted); font-size: .86rem; }
    .block b { display: block; color: var(--text); font-weight: 500; }
    .recruits { margin-top: 1.1rem; border-top: 1px solid rgba(212,175,55,.2); padding-top: .8rem; }
    .recruits h3 { font-size: .72rem; letter-spacing: .14em; color: var(--line); }
    .empty { color: var(--muted); font-size: .85rem; margin-top: .5rem; }
    .marker-cluster-small, .marker-cluster-medium, .marker-cluster-large {
      background: rgba(212,175,55,.18) !important;
    }
    .marker-cluster-small div, .marker-cluster-medium div, .marker-cluster-large div {
      background: #d4af37 !important; color: #111 !important; font-weight: 700;
    }
    .leaflet-tooltip { background: #0e130e; color: var(--text); border: 1px solid var(--line); }
    @media (max-width: 980px) { header, .layout { display: block; } .filters { margin-top: .6rem; flex-wrap: wrap; } }
  </style>
</head>

    });

    function showSchool(s) {
      panel.innerHTML = `
        <div class="top">
          <div class="photo">SCHOOL<br>PHOTO</div>
          <div>
            <h2>${s.name}</h2>
            ${s.cls ? `<div class="badge">Class ${s.cls}</div>` : ""}
            <div class="loc">${s.city}, GA • ${s.county} County</div>
          </div>
        </div>
        <div class="block">Head Coach<b>${s.coach}</b></div>
        <div class="block">Stadium / Address<b>${s.stadium}</b>${s.address}</div>
        <div class="recruits">
          <h3>RECRUITS</h3>
          <p class="empty">Recruits will appear here later. This panel is school identity only for now.</p>
        </div>
      `;
    }

    const map = L.map("map", { zoomControl: false, attributionControl: false }).setView([32.65, -83.45], 7);
    L.control.zoom({ position: "bottomleft" }).addTo(map);
    L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", { opacity: 0.7 }).addTo(map);

    fetch("https://raw.githubusercontent.com/johan/world.geo.json/master/countries/USA/GA.geo.json")
      .then(r => r.json())
      .then(geo => {
        L.geoJSON(geo, {
          interactive: false,
          style: { color: "#d4af37", weight: 1.6, fillColor: "#2a332a", fillOpacity: 0.35 }
        }).addTo(map);
      });

    const clusters = L.markerClusterGroup({
      showCoverageOnHover: false,
      maxClusterRadius: 48
    });

    function pinFor(s) {
      const m = L.circleMarker([s.lat, s.lng], {
        radius: 6, color: "#d4af37", fillColor: "#f0d56a", fillOpacity: 0.95, weight: 1
      });
      m.school = s;
      m.bindTooltip(s.name);
      m.on("click", () => showSchool(s));
      return m;
    }

    function render(list) {
      clusters.clearLayers();
      list.forEach(s => clusters.addLayer(pinFor(s)));
    }

    map.addLayer(clusters);
    render(schools);
    showSchool(schools.find(s => s.name.startsWith("Grayson")) || schools[0]);

    function applyFilters() {
      const q = document.getElementById("q").value.toLowerCase();
      const cl = document.getElementById("cls").value;
      const co = document.getElementById("cty").value;
      render(schools.filter(s =>
        (!q || s.name.toLowerCase().includes(q) || s.city.toLowerCase().includes(q)) &&
        (!cl || s.cls === cl) &&
        (!co || s.county === co)
      ));
    }
    document.getElementById("q").addEventListener("input", applyFilters);
    document.getElementById("cls").addEventListener("change", applyFilters);
    document.getElementById("cty").addEventListener("change", applyFilters);
  </script>
</body>
</html>
