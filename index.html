html,body{min-height:100%;font-family:Georgia,serif;background:var(--bg);color:var(--text)}
body{overflow:auto}
.bar1{display:flex;align-items:center;justify-content:space-between;gap:.7rem;padding:.55rem 1rem;border-bottom:1px solid rgba(212,175,55,.22);flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:.6rem}
.ga{width:34px;height:34px;border:1.5px solid var(--line);border-radius:50%;display:grid;place-items:center;color:var(--line);font-size:.7rem}
.logo h1{font-size:.74rem;letter-spacing:.16em;color:var(--line)}
.logo p{font-size:.6rem;letter-spacing:.08em;color:var(--muted)}
.nav{display:flex;gap:.45rem;flex-wrap:wrap}
a.board{color:var(--line);text-decoration:none;letter-spacing:.12em;font-size:.62rem;border:1px solid rgba(212,175,55,.35);padding:.42rem .55rem;white-space:nowrap}
a.board.on{color:#1a1608;background:var(--line);border-color:var(--line)}
main{display:grid;grid-template-columns:minmax(280px,420px) 1fr;min-height:calc(100vh - 62px)}
.left,.right{padding:1rem;overflow:auto}
.right{border-left:1px solid rgba(212,175,55,.22);background:radial-gradient(circle at 20% 0%,#162016,var(--panel) 55%)}
.kicker{font-size:.62rem;letter-spacing:.18em;color:var(--line);margin:.7rem 0 .45rem}
.kicker:first-child{margin-top:0}
.search,select,input[type=text]{width:100%;background:#101510;border:1px solid rgba(212,175,55,.35);color:var(--text);padding:.48rem .7rem;font:inherit}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:.45rem;margin:.55rem 0 .7rem}
.school{display:grid;grid-template-columns:1fr auto;gap:.4rem;padding:.7rem 0;border-bottom:1px dashed rgba(212,175,55,.28);align-items:center}
.n{font-size:.92rem}
.sub{color:var(--muted);font-size:.72rem;margin-top:.15rem}
.btn{background:#101510;border:1px solid rgba(212,175,55,.35);color:var(--muted);padding:.38rem .5rem;font:inherit;letter-spacing:.1em;font-size:.62rem;cursor:pointer}
.btn.on{color:#1a1608;background:var(--line);border-color:var(--line)}
.title{font-size:1.2rem;letter-spacing:.08em;margin:.15rem 0 .8rem}
.start{display:flex;align-items:center;gap:.6rem;margin-bottom:.85rem}
.start .pin{width:28px;height:28px;border-radius:50%;background:var(--line);color:#1a1608;display:grid;place-items:center;font-size:.8rem;flex:none}
.loop{margin-left:auto;display:flex;align-items:center;gap:.4rem;color:var(--muted);font-size:.72rem;letter-spacing:.08em;white-space:nowrap}
.stop{display:grid;grid-template-columns:36px 1fr auto;gap:.55rem;padding:.7rem 0;border-bottom:1px dashed rgba(212,175,55,.28)}
.num{width:28px;height:28px;border-radius:50%;background:var(--line);color:#1a1608;display:grid;place-items:center;font-weight:700;font-size:.8rem}
.mi{color:var(--line);font-size:.78rem;text-align:right}
.tools{display:flex;flex-direction:column;gap:.25rem}
#map{height:190px;margin:.8rem 0 1rem;border:1px solid rgba(212,175,55,.28);background:#070907}
.summary{border:1px solid var(--line);padding:.75rem;margin-top:.4rem}
.summary p{font-size:.86rem;margin-bottom:.65rem}
.actions{display:flex;flex-wrap:wrap;gap:.45rem}
.actions a,.actions button{color:var(--line);text-decoration:none;border:1px solid rgba(212,175,55,.35);padding:.4rem .55rem;font-size:.72rem;background:none;font:inherit;cursor:pointer}
.empty{color:var(--muted);padding:.6rem 0;font-size:.8rem}
.warn{color:#e2c56a;font-size:.72rem;margin:.35rem 0}
@media(max-width:900px){
  main{grid-template-columns:1fr}
  .right{border-left:0;border-top:1px solid rgba(212,175,55,.22)}
}
@media print{
  .bar1,.left,.actions,.loop,button,.tools{display:none!important}
  .right{border:0;background:#fff;color:#111}
  .n,.title{color:#111}
}
</style>

</main>

const KEY="mappedRecruiting.trip";
const byId=Object.fromEntries(schools.map(s=>[s.id,s]));
const params=new URLSearchParams(location.search);

[...new Set(schools.map(s=>s.county))].sort().forEach(c=>{
  const o=document.createElement("option");
  o.value=c; o.textContent=c;
  document.getElementById("cty").appendChild(o);
});

function esc(t){return String(t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function miles(aLat,aLng,bLat,bLng){
  const R=3958.8,toR=d=>d*Math.PI/180;
  const dLat=toR(bLat-aLat),dLng=toR(bLng-aLng);
  const m=Math.sin(dLat/2)**2+Math.cos(toR(aLat))*Math.cos(toR(bLat))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.min(1,Math.sqrt(m)));
}

let trip={
  name:params.get("name")||"THE RECRUITING TRAIL",
  start:params.get("start")||"",
  loop:params.get("loop")!=="0",
  ids:(params.get("stops")||"").split(",").filter(Boolean),
  here:null
};
try{
  const saved=JSON.parse(localStorage.getItem(KEY)||"null");
  if(saved && !params.get("stops") && !params.get("add")){
    trip={...trip,...saved,ids:saved.ids||[]};
  }
}catch(e){}
const add=params.get("add");
if(add && byId[add] && !trip.ids.includes(add)) trip.ids.push(add);

function save(){
  localStorage.setItem(KEY,JSON.stringify({name:trip.name,start:trip.start,loop:trip.loop,ids:trip.ids}));
  const u=new URL(location.href);
  u.search="";
  if(trip.ids.length) u.searchParams.set("stops",trip.ids.join(","));
  if(trip.start) u.searchParams.set("start",trip.start);
  u.searchParams.set("loop",trip.loop?"1":"0");
  if(trip.name) u.searchParams.set("name",trip.name);
  history.replaceState(null,"",u);
}

document.getElementById("tripName").value=trip.name;
document.getElementById("start").value=trip.start;
document.getElementById("loop").checked=trip.loop;

}).addTo(map);

function stops(){return trip.ids.map(id=>byId[id]).filter(Boolean);}

function fromPoint(){
  const list=stops();
  if(list.length) return {lat:list[list.length-1].lat,lng:list[list.length-1].lng,label:list[list.length-1].name};
  if(trip.here) return {lat:trip.here.lat,lng:trip.here.lng,label:"your location"};
  return null;
}

function schoolRow(s,extra){
  const on=trip.ids.includes(s.id);
  return `<div class="school">
    <div><div class="n">${esc(s.name)}</div><div class="sub">${esc(s.city)} · ${esc(s.county)} · Class ${esc(s.cls)}</div></div>
    <div>
      ${extra?`<div class="mi">${extra}</div>`:""}
      <button class="btn ${on?"on":""}" data-add="${esc(s.id)}" ${on?"disabled":""}>${on?"ON TRIP":"+ ADD"}</button>
    </div>
  </div>`;
}

function renderResults(){
  const q=document.getElementById("q").value.toLowerCase().trim();
  const cl=document.getElementById("cls").value;
  const co=document.getElementById("cty").value;
  const list=schools.filter(s=>{
    const text=!q||s.name.toLowerCase().includes(q)||s.city.toLowerCase().includes(q)||s.county.toLowerCase().includes(q);
    return text&&(!cl||s.cls===cl)&&(!co||s.county===co);
  }).slice(0,60);
  document.getElementById("results").innerHTML=list.map(s=>schoolRow(s)).join("")||'<p class="empty">No schools match.</p>';
}

function renderNearby(){
  const origin=fromPoint();
  const box=document.getElementById("nearby");
  const kicker=document.getElementById("nearKicker");
  if(!origin){
    kicker.textContent="CLOSEST SCHOOLS";
    box.innerHTML='<p class="empty">Add a school or use my location to see nearby stops.</p>';
    return;
  }
  kicker.textContent="CLOSEST TO "+origin.label.toUpperCase();
  const near=schools
    .filter(s=>!trip.ids.includes(s.id))
    .map(s=>({...s,d:miles(origin.lat,origin.lng,s.lat,s.lng)}))
    .sort((a,b)=>a.d-b.d)
    .slice(0,8);
  box.innerHTML=near.map(s=>schoolRow(s,s.d.toFixed(0)+" mi")).join("")||'<p class="empty">Every nearby school is already on the trip.</p>';
}

function renderTrip(){
  const list=stops();
  let total=0;
  const rows=list.map((s,i)=>{
    const prev=i?list[i-1]:null;
    const d=prev?miles(prev.lat,prev.lng,s.lat,s.lng):(trip.here?miles(trip.here.lat,trip.here.lng,s.lat,s.lng):null);
    if(d!=null) total+=d;
    return `<div class="stop">
      <div class="num">${i+1}</div>
      <div>
        <div class="n">${esc(s.name)}</div>
        <div class="sub">${esc(s.stadium)}<br>${esc(s.address)}<br>${esc(s.city)} · Coach ${esc(s.coach)}</div>
      </div>
      <div>
        <div class="mi">${d!=null?d.toFixed(0)+" mi":""}</div>
        <div class="tools">
          <button class="btn" data-up="${i}" ${i?"":"disabled"}>▲</button>
          <button class="btn" data-down="${i}" ${i<list.length-1?"":"disabled"}>▼</button>
          <button class="btn" data-rm="${esc(s.id)}">×</button>
        </div>
      </div>
    </div>`;
  }).join("")||'<p class="empty">Add schools from the left. They stay in order as your stops.</p>';
  document.getElementById("stops").innerHTML=rows;
  if(trip.loop && list.length && trip.here){
    total+=miles(list[list.length-1].lat,list[list.length-1].lng,trip.here.lat,trip.here.lng);
  }
  document.getElementById("stats").textContent=
    `${list.length} stop${list.length===1?"":"s"} · ~${total?total.toFixed(0):"—"} miles${trip.loop?" · loop home":""}`;
  document.getElementById("warn").hidden=list.length<=9;
  wireMaps(list);
  drawMap(list);
}

function wireMaps(list){
  const start=trip.start||"Georgia";
  const addrs=list.map(s=>s.address);
  if(!addrs.length){
    document.getElementById("gmaps").href="#";
    document.getElementById("amaps").href="#";
    return;
  }
  let dest, waypoints;
  if(trip.loop){
    dest=start;
    waypoints=addrs;
  }else{
    dest=addrs[addrs.length-1];
    waypoints=addrs.slice(0,-1);
  }
  document.getElementById("gmaps").href="https://www.google.com/maps/dir/?api=1&travelmode=driving"+
    "&origin="+encodeURIComponent(start)+
    "&destination="+encodeURIComponent(dest)+
    (waypoints.length?"&waypoints="+encodeURIComponent(waypoints.slice(0,9).join("|")):"");
  const applePts=[start,...addrs];
  document.getElementById("amaps").href="https://maps.apple.com/?dirflg=d&saddr="+encodeURIComponent(applePts[0])+
    "&daddr="+encodeURIComponent(applePts.slice(1).join(" to:"));
}

function drawMap(list){
  layer.clearLayers();
  if(!list.length){map.setView([32.65,-83.5],7);return;}
  const pts=list.map(s=>[s.lat,s.lng]);
  if(trip.here) pts.unshift([trip.here.lat,trip.here.lng]);
  L.polyline(pts,{color:"#d4af37",weight:3}).addTo(layer);
  list.forEach((s,i)=>{
    L.marker([s.lat,s.lng],{
      icon:L.divIcon({className:"",html:`<div class="num">${i+1}</div>`,iconSize:[28,28],iconAnchor:[14,14]})
    }).bindTooltip(s.name).addTo(layer);
  });
  map.fitBounds(L.latLngBounds(pts).pad(0.2));
  setTimeout(()=>map.invalidateSize(),200);
}

function render(){save();renderResults();renderNearby();renderTrip();}

function addSchool(id){
  if(!id||trip.ids.includes(id)||!byId[id]) return;
  trip.ids.push(id);
  render();
}

document.getElementById("nearby").addEventListener("click",e=>{
  const b=e.target.closest("[data-add]");
  if(b) addSchool(b.dataset.add);
});
document.getElementById("results").addEventListener("click",e=>{
  const b=e.target.closest("[data-add]");
  if(b) addSchool(b.dataset.add);
});
document.getElementById("stops").addEventListener("click",e=>{
  const rm=e.target.closest("[data-rm]");
  const up=e.target.closest("[data-up]");
  const down=e.target.closest("[data-down]");
  if(rm) trip.ids=trip.ids.filter(id=>id!==rm.dataset.rm);
  if(up){
    const i=+up.dataset.up;
    [trip.ids[i-1],trip.ids[i]]=[trip.ids[i],trip.ids[i-1]];
  }
  if(down){
    const i=+down.dataset.down;
    [trip.ids[i+1],trip.ids[i]]=[trip.ids[i],trip.ids[i+1]];
  }
  render();
});
["q","cls","cty"].forEach(id=>{
  document.getElementById(id).addEventListener(id==="q"?"input":"change",renderResults);
});
document.getElementById("tripName").addEventListener("input",e=>{trip.name=e.target.value;save();});
document.getElementById("start").addEventListener("input",e=>{trip.start=e.target.value;save();wireMaps(stops());});
document.getElementById("loop").addEventListener("change",e=>{trip.loop=e.target.checked;render();});
document.getElementById("hereBtn").onclick=()=>{
  if(!navigator.geolocation){alert("Location is not available.");return;}
  navigator.geolocation.getCurrentPosition(pos=>{
    trip.here={lat:pos.coords.latitude,lng:pos.coords.longitude};
    if(!trip.start) trip.start="My location";
    document.getElementById("start").value=trip.start;
    render();
  },()=>alert("Could not read your location."),{enableHighAccuracy:true,timeout:10000});
};
document.getElementById("copyBtn").onclick=async()=>{
  try{await navigator.clipboard.writeText(location.href);document.getElementById("copyBtn").textContent="Copied";}
  catch(e){prompt("Copy this link",location.href);}
};
document.getElementById("printBtn").onclick=()=>window.print();
document.getElementById("clearBtn").onclick=()=>{trip.ids=[];trip.here=null;render();};
document.getElementById("optBtn").onclick=()=>{
  const rest=stops();
  if(rest.length<3) return;
  const used=new Set();
  let cur=trip.here||{lat:rest[0].lat,lng:rest[0].lng};
  if(!trip.here) used.add(rest[0].id);
  const out=trip.here?[]:[rest[0].id];
  while(out.length<rest.length){
    let best=null,bestD=1e9;
    rest.forEach(s=>{
      if(used.has(s.id)) return;
      const d=miles(cur.lat,cur.lng,s.lat,s.lng);
      if(d<bestD){bestD=d;best=s;}
    });
    if(!best) break;
    used.add(best.id);
    out.push(best.id);
    cur=best;
  }
  trip.ids=out;
  render();
};
render();
</script>
</body>
</html>
