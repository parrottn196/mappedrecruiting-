  <style>
    :root { --bg:#0b100c; --panel:#121a14; --line:#c9a227; --text:#f3ead1; --muted:#b7b09a; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:Georgia, serif; background:var(--bg); color:var(--text); }
    header { display:flex; justify-content:space-between; align-items:center; gap:1rem; padding:1rem 1.25rem; border-bottom:1px solid rgba(201,162,39,.35); }
    .brand { letter-spacing:.12em; font-size:.95rem; }
    .brand span { color:var(--line); }
    .tag { font-size:.75rem; color:var(--muted); }
    .staff { border:1px solid var(--line); color:var(--line); background:transparent; padding:.55rem .9rem; letter-spacing:.08em; font-size:.72rem; text-transform:uppercase; }
    .layout { display:grid; grid-template-columns:1.2fr .8fr; min-height:calc(100vh - 64px); }
    #map { min-height:560px; }
    .drawer { border-left:1px solid rgba(201,162,39,.28); padding:1.25rem; background:linear-gradient(180deg,#101710,#0b100c); }
    .kicker { color:var(--line); font-size:.72rem; letter-spacing:.14em; text-transform:uppercase; }
    h1 { font-size:1.45rem; margin:.35rem 0 .5rem; }
    .meta { color:var(--muted); font-size:.95rem; line-height:1.45; margin-bottom:.4rem; }
    .hint { color:var(--muted); font-size:.8rem; margin-top:1.25rem; }
    .map-label { background:none; border:none; }
    .city-lab { color:#8a6d12; font:700 12px Georgia,serif; text-shadow:0 0 4px #fff,0 0 4px #fff; white-space:nowrap; }
    .state-lab { color:#8a6d12; font:700 11px Georgia,serif; letter-spacing:.12em; opacity:.8; text-shadow:0 0 4px #fff; white-space:nowrap; }
    @media (max-width:900px){ .layout{grid-template-columns:1fr;} .drawer{border-left:0;border-top:1px solid rgba(201,162,39,.28);} }
  </style>
