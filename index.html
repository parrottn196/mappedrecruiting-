    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:Georgia, serif; background:var(--bg); color:var(--text); }
    header { display:flex; justify-content:space-between; align-items:center; gap:1rem; padding:1rem 1.25rem; border-bottom:1px solid rgba(201,162,39,.35); }
    .brand { letter-spacing:.12em; font-size:.95rem; }
    .brand span { color:var(--line); }
    .tag { font-size:.75rem; color:var(--muted); }
    .staff { border:1px solid var(--line); color:var(--line); background:transparent; padding:.55rem .9rem; cursor:pointer; letter-spacing:.08em; font-size:.72rem; text-transform:uppercase; }
    .layout { display:grid; grid-template-columns:1.15fr .85fr; min-height:calc(100vh - 64px); }
    #map { min-height:560px; }
    .drawer { border-left:1px solid rgba(201,162,39,.28); padding:1.25rem; background:linear-gradient(180deg,#101710,#0b100c); }
    .kicker { color:var(--line); font-size:.72rem; letter-spacing:.14em; text-transform:uppercase; }
    h1 { font-size:1.45rem; margin:.35rem 0 .2rem; }
    .meta { color:var(--muted); font-size:.9rem; margin-bottom:.45rem; }
    .card { border:1px solid rgba(201,162,39,.35); padding:1rem; background:var(--panel); margin-top:1rem; }
    .pos { color:var(--line); font-size:.8rem; }
    .row { display:flex; justify-content:space-between; padding:.45rem 0; border-bottom:1px solid rgba(243,234,209,.08); }
    .lock { margin-top:.8rem; padding:.85rem; border:1px dashed rgba(201,162,39,.45); color:var(--muted); font-size:.88rem; }
    .lock strong { color:var(--line); }
    .empty { color:var(--muted); margin-top:1rem; }
    @media (max-width:900px){ .layout{grid-template-columns:1fr;} .drawer{border-left:0;border-top:1px solid rgba(201,162,39,.28);} }
