<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MappedRecruiting — Georgia Football Recruiting</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <style>
    :root {
      --bg: #070907;
      --panel: #0b110c;
      --line: #d4af37;
      --text: #f3ead1;
      --muted: #9a9178;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      overflow: hidden;
      font-family: Georgia, "Times New Roman", serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      height: 68px;
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 1rem;
      align-items: center;
      padding: 0 1.1rem;
      border-bottom: 1px solid rgba(212,175,55,.25);
    }
    .logo { display: flex; align-items: center; gap: .65rem; }
    .ga {
      width: 36px; height: 36px;
      border: 1.5px solid var(--line);
      border-radius: 50%;
      display: grid; place-items: center;
      color: var(--line); font-size: .72rem;
    }
    .logo h1 { font-size: .78rem; letter-spacing: .16em; color: var(--line); }
    .logo p { font-size: .62rem; letter-spacing: .08em; color: var(--muted); }
    .search-wrap { position: relative; }
    .search-wrap:before {
      content: "⌕";
      position: absolute; left: .6rem; top: .42rem;
      color: var(--line);
    }
    .search {
      width: 100%; max-width: 420px;
      background: #0c100c;
      border: 1px solid rgba(212,175,55,.35);
      color: var(--text);
      padding: .55rem .8rem .55rem 2rem;
      font: inherit;
    }
    .filters { display: flex; gap: .7rem; font-size: .68rem; color: var(--muted); }
    .filters label { display: grid; gap: .2rem; }
    .filters select {
      background: transparent;
      color: var(--text);
      border: 0;
      border-bottom: 1px solid rgba(212,175,55,.35);
      padding: .2rem 1rem .2rem 0;
      font: inherit;
    }
    .layout {
      display: grid;
      grid-template-columns: 1.15fr .85fr;
      height: calc(100vh - 68px);
    }
    #map, .leaflet-container { background: #070907; height: 100%; width: 100%; }
    .leaflet-tile-pane { filter: brightness(1.35) contrast(1.05); }
    .hint-map {
      position: absolute; left: 14px; bottom: 12px; z-index: 500;
      color: var(--muted); font-size: .72rem;
    }
    .drawer { padding: 1rem; height: 100%; }
    .card {
      position: relative;
      background:
        radial-gradient(120% 80% at 100% 0%, rgba(212,175,55,.05), transparent 46%),
        repeating-linear-gradient(135deg, rgba(212,175,55,.035) 0 2px, transparent 2px 10px),
        var(--panel);
      border: 1.5px solid var(--line);
      border-radius: 4px;
      padding: 1.25rem 1.2rem 1.3rem;
      height: calc(100vh - 100px);
      overflow: auto;
      box-shadow:
        inset 0 0 0 6px var(--panel),
        inset 0 0 0 7px rgba(212,175,55,.45);
    }
    .card:before, .card:after,
    .card-corners:before, .card-corners:after {
      content: "";
      position: absolute;
      width: 16px; height: 16px;
      border-color: var(--line);
      border-style: solid;
      pointer-events: none;
    }
    .card:before { top: 8px; left: 8px; border-width: 1.5px 0 0 1.5px; }
    .card:after { top: 8px; right: 8px; border-width: 1.5px 1.5px 0 0; }
    .card-corners { position: absolute; inset: 0; pointer-events: none; }
    .card-corners:before { bottom: 8px; left: 8px; border-width: 0 0 1.5px 1.5px; }
    .card-corners:after { bottom: 8px; right: 8px; border-width: 0 1.5px 1.5px 0; }

    .top { display: grid; grid-template-columns: 88px 1fr; gap: .95rem; align-items: start; }
    .mono {
      width: 88px; height: 88px;
      border: 1.6px solid var(--line);
      border-radius: 3px;
      display: grid; place-items: center;
      color: var(--line);
      font-size: 1.85rem;
      letter-spacing: -.02em;
      font-weight: 600;
      background: #0c140e;
      line-height: .8;
    }
    .mono span { transform: translateY(1px); }
    .card h2 {
      font-weight: 500;
      font-size: 1.62rem;
      line-height: 1.12;
      color: #f6edd6;
    }
    .badge {
      display: inline-block;
      background: #c9a227;
      color: #1b1608;
      border: 0;
      font-size: .58rem;
      letter-spacing: .16em;
      font-weight: 700;
      padding: .22rem .52rem;
      margin-top: .48rem;
      border-radius: 3px;
    }
    .loc {
      color: var(--muted);
      font-size: .8rem;
      margin-top: .42rem;
    }
    .row {
      display: grid;
      grid-template-columns: 28px 1fr;
      gap: .75rem;
      align-items: start;
      padding: .92rem 0;
      border-bottom: 1px solid rgba(212,175,55,.2);
    }
    .ico {
      width: 22px; height: 22px;
      color: var(--line);
      margin-top: 2px;
    }
    .row small {
      display: block;
      color: var(--line);
      letter-spacing: .16em;
      font-size: .62rem;
      font-weight: 600;
    }
    .row b {
      display: block;
      font-weight: 500;
      margin-top: .2rem;
      color: var(--text);
      font-size: .98rem;
    }
    .addr-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: .7rem;
      align-items: end;
    }
    .actions a {
      color: var(--line);
      text-decoration: none;
      font-size: .8rem;
      white-space: nowrap;
    }
    .recruits { margin-top: .85rem; text-align: center; }
    .recruits h3 {
      font-size: .72rem;
      letter-spacing: .32em;
      color: var(--line);
      font-weight: 500;
      margin: .2rem 0 .85rem;
    }
    .slots { display: grid; gap: .58rem; }
    .slot {
      height: 38px;
      border: 1px solid rgba(212,175,55,.28);
      border-radius: 3px;
      position: relative;
    }
    .slot:after {
      content: "◆";
      position: absolute;
      left: 50%;
      top: -7px;
      transform: translateX(-50%);
      color: var(--line);
      font-size: .5rem;
    }
    .marker-cluster-small,
    .marker-cluster-medium,
    .marker-cluster-large { background: rgba(212,175,55,.18) !important; }
    .marker-cluster-small div,
    .marker-cluster-medium div,
    .marker-cluster-large div {
      background: #d4af37 !important;
      color: #111 !important;
      font-weight: 700;
    }
    .leaflet-tooltip {
      background: #0e130e;
      color: var(--text);
      border: 1px solid var(--line);
    }
    @media (max-width: 980px) {
      html, body { overflow: auto; }
      header, .layout { display: block; height: auto; }
      #map { min-height: 70vh; }
    }
  </style>
</head>

        .replace(/High School/i, "")
        .replace(/School/i, "")
        .replace(/Academy|Institute|Catholic/gi, "")
        .trim();
      const parts = cleaned.split(/\s+/).filter(Boolean);
      if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
      return cleaned.slice(0, 2).toUpperCase();
    }

    function showSchool(s) {
      const maps = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(s.address);
      const title = s.name.replace(/\s+High School$/i, "<br>High School");
      const addr = s.address.replace(", ", ",<br>");
      panel.innerHTML = `
        <div class="card-corners"></div>
        <div class="top">
          <div class="mono"><span>${initials(s.name)}</span></div>
          <div>
            <h2>${title}</h2>
            ${s.cls ? `<div class="badge">CLASS ${s.cls}</div>` : ""}
            <div class="loc">${s.city}, GA • ${s.county} County</div>
          </div>
        </div>
        <div class="row">${iconShield}<div><small>HEAD COACH</small><b>${s.coach}</b></div></div>
        <div class="row">${iconStadium}<div><small>STADIUM</small><b>${s.stadium}</b></div></div>
        <div class="row">${iconPin}<div>
          <div class="addr-row">
            <div><small>ADDRESS</small><b>${addr}</b></div>
            <div class="actions"><a href="${maps}" target="_blank" rel="noopener">Directions ›</a></div>
          </div>
        </div></div>
        <div class="recruits">
          <h3>RECRUITS</h3>
          <div class="slots"><div class="slot"></div><div class="slot"></div><div class="slot"></div></div>
        </div>
      `;
    }

    const map = L.map("map", { zoomControl: false, attributionControl: false }).setView([32.65, -83.45], 7);
    L.control.zoom({ position: "bottomleft" }).addTo(map);
    L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", { opacity: 0.7 }).addTo(map);
    setTimeout(() => map.invalidateSize(), 200);
    window.addEventListener("resize", () => map.invalidateSize());

    fetch("https://raw.githubusercontent.com/johan/world.geo.json/master/countries/USA/GA.geo.json")
      .then(r => r.json())
      .then(geo => {
        L.geoJSON(geo, {
          interactive: false,
          style: { color: "#d4af37", weight: 1.6, fillColor: "#2a332a", fillOpacity: 0.35 }
        }).addTo(map);
      });

    const clusters = L.markerClusterGroup({ showCoverageOnHover: false, maxClusterRadius: 48 });
    function pinFor(s) {
      const m = L.circleMarker([s.lat, s.lng], {
        radius: 6, color: "#d4af37", fillColor: "#f0d56a", fillOpacity: 0.95, weight: 1
      });
      m.bindTooltip(s.name);
      m.on("click", () => showSchool(s));
      return m;
    }
    function render(list) {
      clusters.clearLayers();
      list.forEach(s => clusters.addLayer(pinFor(s)));
    }
    map.addLayer(clusters);
    render(schools);
    showSchool(schools.find(s => s.name.startsWith("Mountain View")) || schools[0]);

    function applyFilters() {
      const q = document.getElementById("q").value.toLowerCase();
      const cl = document.getElementById("cls").value;
      const co = document.getElementById("cty").value;
      render(schools.filter(s =>
        (!q || s.name.toLowerCase().includes(q) || s.city.toLowerCase().includes(q)) &&
        (!cl || s.cls === cl) &&
        (!co || s.county === co)
      ));
    }
    document.getElementById("q").addEventListener("input", applyFilters);
    document.getElementById("cls").addEventListener("change", applyFilters);
    document.getElementById("cty").addEventListener("change", applyFilters);
  </script>
</body>
</html>
