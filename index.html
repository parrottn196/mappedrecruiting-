<style>
:root{--bg:#070907;--panel:#0c110c;--line:#d4af37;--text:#f3ead1;--muted:#9a9178}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:Georgia,serif;background:var(--bg);color:var(--text)}
header.site{display:block}
.bar1,.bar2{display:flex;align-items:center;gap:.7rem;padding:.55rem 1rem}
.bar1{justify-content:space-between;border-bottom:1px solid rgba(212,175,55,.22)}
.bar2{justify-content:flex-start;background:#0a0e0a;border-bottom:1px solid rgba(212,175,55,.18);position:relative}
.logo{display:flex;align-items:center;gap:.6rem;flex:0 0 auto}
.ga{width:34px;height:34px;border:1.5px solid var(--line);border-radius:50%;display:grid;place-items:center;color:var(--line);font-size:.7rem}
.logo h1{font-size:.74rem;letter-spacing:.16em;color:var(--line)}
.logo p{font-size:.6rem;letter-spacing:.08em;color:var(--muted)}
.search{flex:1;max-width:520px;background:#101510;border:1px solid rgba(212,175,55,.35);color:var(--text);padding:.48rem .7rem;font:inherit}
select{background:#101510;border:1px solid rgba(212,175,55,.35);color:var(--text);padding:.42rem .5rem;font:inherit}
.btn{background:#101510;border:1px solid rgba(212,175,55,.35);color:var(--muted);padding:.42rem .55rem;font:inherit;letter-spacing:.1em;font-size:.62rem;cursor:pointer}
.btn.on{color:#1a1608;background:var(--line);border-color:var(--line)}
a.board{color:var(--line);text-decoration:none;letter-spacing:.12em;font-size:.62rem;border:1px solid rgba(212,175,55,.35);padding:.42rem .55rem;white-space:nowrap}
.near-group{display:flex;align-items:stretch}
.near-group .btn{border-right:0}
.near-group select{border-left:0}
.grow{flex:1}
.filter-box{position:absolute;right:1rem;top:calc(100% + 6px);z-index:5000;min-width:220px;background:#0d130d;border:1px solid var(--line);padding:.75rem;display:none}
.filter-box.on{display:block}
.filter-box label{display:flex;flex-direction:column;gap:.25rem;font-size:.58rem;letter-spacing:.12em;color:var(--muted);margin-bottom:.55rem}
.filter-box select{width:100%}
main{height:calc(100% - 108px);display:grid;grid-template-columns:1fr 400px}
#map{height:100%;background:#0a0d0a}
.drawer{border-left:1px solid rgba(212,175,55,.22);overflow:auto;padding:1rem;background:radial-gradient(circle at 20% 0%,#162016,var(--panel) 55%)}
.kicker{font-size:.62rem;letter-spacing:.18em;color:var(--line);margin-bottom:.35rem}
.count{color:var(--muted);font-size:.72rem;margin-bottom:.7rem}
.school,.region{display:grid;grid-template-columns:1fr auto;gap:.4rem;padding:.7rem 0;border-bottom:1px dashed rgba(212,175,55,.28);cursor:pointer}
.school:hover .n,.region:hover .n{color:var(--line)}
.n{font-size:.92rem}
.sub{color:var(--muted);font-size:.72rem;margin-top:.15rem}
.mi{color:var(--line);font-size:.78rem;white-space:nowrap}
.legend{display:flex;gap:1rem;font-size:.68rem;color:var(--muted);margin:0 0 .8rem}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:.35rem;vertical-align:middle}
.dot.yes{background:#f0d56a}.dot.no{background:#5c5748}
.tag{display:inline-block;border:1px solid var(--line);color:var(--line);font-size:.55rem;letter-spacing:.12em;padding:.12rem .32rem;margin-left:.35rem}
.tag.off{border-color:#5c5748;color:#5c5748}
.card{border:1px solid var(--line);padding:1.05rem 1rem;background:linear-gradient(180deg,rgba(212,175,55,.06),transparent 28%),#0d130d}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:.6rem}
.mono{width:54px;height:54px;border:1px solid var(--line);display:grid;place-items:center;color:var(--line)}
.badge{border:1px solid var(--line);color:var(--line);font-size:.62rem;letter-spacing:.16em;padding:.25rem .4rem}
.title{font-size:1.2rem;margin:.35rem 0 .55rem}
.row{margin:.38rem 0;font-size:.86rem;color:#efe6c8}
.muted{color:var(--muted);font-size:.74rem}
.actions{display:flex;flex-wrap:wrap;gap:.45rem;margin-top:.9rem;align-items:center}
.actions a,.back{color:var(--line);text-decoration:none;border:1px solid rgba(212,175,55,.35);padding:.4rem .55rem;font-size:.72rem;background:none;font:inherit;cursor:pointer}
.empty{color:var(--muted);padding:1rem 0}
.leaflet-tooltip{background:#0d130d;color:#f3ead1;border:1px solid #d4af37}
.region-pin{background:#d4af37;color:#1a1608;border:2px solid #f3ead1;border-radius:50%;width:46px;height:46px;display:flex;align-items:center;justify-content:center;font:700 13px Georgia,serif;box-shadow:0 0 0 6px rgba(212,175,55,.25)}
.hwy{background:#1a1608;color:#f0d56a;border:1px solid #d4af37;font:700 10px Georgia,serif;letter-spacing:.06em;padding:1px 5px;text-align:center;white-space:nowrap;pointer-events:none}
.marker-cluster-small{background-color:rgba(240,213,106,.28)}
.marker-cluster-small div{background-color:rgba(240,213,106,.85);color:#1a1608}
.marker-cluster-medium{background-color:rgba(212,175,55,.32)}
.marker-cluster-medium div{background-color:rgba(212,175,55,.92);color:#1a1608}
.marker-cluster-large{background-color:rgba(139,105,20,.38)}
.marker-cluster-large div{background-color:rgba(139,105,20,.95);color:#f3ead1}
.marker-cluster{border:1px solid rgba(212,175,55,.55)}
@media(max-width:900px){
  main{grid-template-rows:1fr 46%;grid-template-columns:1fr;height:calc(100% - 148px)}
  .drawer{border-left:0;border-top:1px solid rgba(212,175,55,.22)}
  .bar1,.bar2{flex-wrap:wrap}
}
</style>
</head>

(function separateStackedPins(){
  const seen = new Map();
  schools.forEach(s=>{
    const key = s.lat.toFixed(4)+","+s.lng.toFixed(4);
    const n = seen.get(key) || 0;
    if(n){
      const ang = n * 0.9;
      s.lat += 0.006 * Math.cos(ang);
      s.lng += 0.006 * Math.sin(ang);
    }
    seen.set(key, n+1);
  });
})();

  "East Georgia":["Burke","Columbia","Glascock","Hancock","Jefferson","Jenkins","Lincoln","McDuffie","Richmond","Taliaferro","Warren","Washington","Wilkes"],
  "West Georgia":["Chattahoochee","Clay","Crisp","Dooly","Harris","Macon","Marion","Muscogee","Quitman","Randolph","Schley","Stewart","Sumter","Talbot","Taylor","Webster"],
  "South Georgia":["Appling","Bleckley","Candler","Dodge","Emanuel","Evans","Jeff Davis","Johnson","Laurens","Montgomery","Tattnall","Telfair","Toombs","Treutlen","Wayne","Wheeler","Wilcox"],
  "Southwest Georgia":["Baker","Calhoun","Colquitt","Decatur","Dougherty","Early","Grady","Lee","Miller","Mitchell","Seminole","Terrell","Thomas","Worth"],
  "Southeast Georgia":["Atkinson","Bacon","Ben Hill","Berrien","Brantley","Brooks","Charlton","Clinch","Coffee","Cook","Echols","Irwin","Lanier","Lowndes","Pierce","Tift","Turner","Ware"],
  "Coastal Georgia":["Bryan","Bulloch","Camden","Chatham","Effingham","Glynn","Liberty","Long","McIntosh","Screven"]
};
const REGION_CENTER={
  "Northwest Georgia":[34.52,-85.05],"Northeast Georgia":[34.55,-83.62],"Metro Atlanta":[33.78,-84.39],
  "West Central Georgia":[33.18,-84.82],"East Central Georgia":[33.92,-83.42],"Middle Georgia":[32.84,-83.63],
  "East Georgia":[33.40,-82.25],"West Georgia":[32.35,-84.55],"South Georgia":[32.25,-82.55],
  "Southwest Georgia":[31.35,-84.25],"Southeast Georgia":[31.22,-82.95],"Coastal Georgia":[31.75,-81.45]
};
function regionOf(county){
  for(const [r,list] of Object.entries(REGION_COUNTIES)) if(list.includes(county)) return r;
  return "Other";
}

[...new Set(schools.map(s=>s.county))].sort().forEach(c=>{
  const o=document.createElement("option");
  o.value=c; o.textContent=c;
  document.getElementById("cty").appendChild(o);
});

function miles(aLat,aLng,bLat,bLng){
  const R=3958.8, toR=d=>d*Math.PI/180;
  const dLat=toR(bLat-aLat), dLng=toR(bLng-aLng);
  const m=Math.sin(dLat/2)**2+Math.cos(toR(aLat))*Math.cos(toR(bLat))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.min(1,Math.sqrt(m)));
}
function mono(name){
  const parts=name.replace(/[()]/g,"").split(/\s+/).filter(w=>!/high|school|academy|catholic|military|county|charter|institute|comprehensive|preparatory|episcopal|christian|collegiate/i.test(w));
  return (parts.slice(0,2).map(w=>w[0]).join("")||name.slice(0,2)).toUpperCase();
}
function gmaps(s){return "https://www.google.com/maps/dir/?api=1&destination="+encodeURIComponent(s.address);}
function amaps(s){return "https://maps.apple.com/?daddr="+encodeURIComponent(s.address);}
function esc(t){return String(t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

let here=null, nearOn=false, sheetOnly=false, selected=null, activeRegion=null;
const map=L.map("map").setView([32.9,-83.5],7);
L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",{attribution:"© OpenStreetMap © CARTO",maxZoom:19}).addTo(map);

const regionBoundsLayer=L.layerGroup();
const highwayLayer=L.layerGroup().addTo(map);

function countyName(props){
  const raw=props.NAME||props.NAME10||props.name||props.NAMELSAD||"";
  return raw.replace(/\s+County$/i,"").trim();
}
function showRegionOutlines(on){
  if(on){
    if(!map.hasLayer(regionBoundsLayer)) regionBoundsLayer.addTo(map);
  } else if(map.hasLayer(regionBoundsLayer)){
    map.removeLayer(regionBoundsLayer);
  }
}

fetch("https://raw.githubusercontent.com/plotly/datasets/master/geojson-counties-fips.json")
  .then(r=>r.json())
  .then(all=>{
    const ga={
      type:"FeatureCollection",
      features:all.features.filter(f=>{
        const id=String(f.id||f.properties.GEO_ID||"");
        const st=String(f.properties.STATE||f.properties.STATEFP||f.properties.STATEFP10||"");
        return id.startsWith("13")||st==="13";
      })
    };
    L.geoJSON(ga,{
      interactive:false,
      style:{color:"#d4af37",weight:1.4,fillColor:"#2a332a",fillOpacity:0.16}
    }).addTo(map);

    const byRegion={};
    ga.features.forEach(f=>{
      const region=regionOf(countyName(f.properties));
      if(!region||region==="Other") return;
      (byRegion[region]||=[]).push(f);
    });
    Object.entries(byRegion).forEach(([name,feats])=>{
      let merged=feats[0];
      for(let i=1;i<feats.length;i++){
        try{ merged=turf.union(merged,feats[i]); }catch(e){}
      }
      const layer=L.geoJSON(merged,{
        style:{color:"#d4af37",weight:2.2,fillColor:"#d4af37",fillOpacity:0.07}
      });
      layer.bindTooltip(name);
      layer.on("click",()=>openRegion(name));
      regionBoundsLayer.addLayer(layer);
    });
    showRegionOutlines(true);
  })
  .catch(()=>{
    fetch("https://raw.githubusercontent.com/johan/world.geo.json/master/countries/USA/GA.geo.json")
      .then(r=>r.json())
      .then(geo=>L.geoJSON(geo,{interactive:false,style:{color:"#d4af37",weight:1.6,fillColor:"#2a332a",fillOpacity:0.35}}).addTo(map))
      .catch(()=>{});
  });

const MAJOR=new Set(["I-16","I-20","I-24","I-59","I-75","I-85","I-95","I-185","I-285","I-516","I-520","I-575","I-675","I-985"]);
const PRIMARY=new Set(["I-16","I-20","I-75","I-85","I-95"]);
function routeList(ref){
  return String(ref||"").split(/[;,]/).map(s=>s.trim().toUpperCase().replace(/\s+/g,"")).map(s=>s.replace(/^I(?=\d)/,"I-")).filter(Boolean);
}
function bestRef(refs){ return refs.find(r=>PRIMARY.has(r))||refs.find(r=>MAJOR.has(r))||refs[0]||""; }

fetch("https://overpass-api.de/api/interpreter",{
  method:"POST",
  body:"data="+encodeURIComponent(`[out:json][timeout:90];area["ISO3166-2"="US-GA"]->.ga;(way["highway"="motorway"]["ref"~"I[- ]?"](area.ga);way["highway"="trunk"]["ref"~"^I[- ]?"](area.ga););out geom;`)
})
.then(r=>r.json())
.then(osm=>{
  const labeled=new Set();
  (osm.elements||[]).forEach(el=>{
    if(!el.geometry||el.geometry.length<2) return;
    const refs=routeList(el.tags&&el.tags.ref);
    const key=bestRef(refs);
    if(!MAJOR.has(key)) return;
    const latlngs=el.geometry.map(p=>[p.lat,p.lon]);
    highwayLayer.addLayer(L.polyline(latlngs,{
      color:"#e6c96a",
      weight:PRIMARY.has(key)?3.2:2,
      opacity:0.9,
      lineCap:"round",
      interactive:false
    }));
    const mid=latlngs[Math.floor(latlngs.length/2)];
    const bucket=key+":"+Math.round(mid[0]*2)+","+Math.round(mid[1]*2);
    const already=[...labeled].filter(x=>x.startsWith(key+":")).length;
    const maxLabels=PRIMARY.has(key)?3:1;
    if(mid&&already<maxLabels&&!labeled.has(bucket)){
      labeled.add(bucket);
      highwayLayer.addLayer(L.marker(mid,{
        interactive:false,keyboard:false,
        icon:L.divIcon({className:"",html:`<div class="hwy">${key}</div>`,iconSize:[34,18],iconAnchor:[17,9]})
      }));
    }
  });
})
.catch(()=>{});

const clusters=L.markerClusterGroup({showCoverageOnHover:false,maxClusterRadius:48}).addTo(map);
const regionLayer=L.layerGroup().addTo(map);
let youMarker=null, radiusCircle=null;

function enrich(s){
  return {...s, mi:here?miles(here.lat,here.lng,s.lat,s.lng):null, region:regionOf(s.county)};
}
function baseFilter(s){
  const q=document.getElementById("q").value.toLowerCase().trim();
  const cl=document.getElementById("cls").value;
  const co=document.getElementById("cty").value;
  const rad=parseFloat(document.getElementById("radius").value);
  const region=regionOf(s.county);
  const text=!q||s.name.toLowerCase().includes(q)||s.city.toLowerCase().includes(q)||s.county.toLowerCase().includes(q)||region.toLowerCase().includes(q);
  if(!(text&&(!cl||s.cls===cl)&&(!co||s.county===co))) return false;
  if(nearOn&&here&&miles(here.lat,here.lng,s.lat,s.lng)>rad) return false;
  if(sheetOnly&&!hasSheet(s)) return false;
  return true;
}
function pool(){ return schools.filter(baseFilter).map(enrich); }
function regionStats(){
  const list=pool();
  return Object.keys(REGION_CENTER).map(name=>{
    const kids=list.filter(s=>s.region===name);
    const [lat,lng]=REGION_CENTER[name];
    return {name,lat,lng,count:kids.length,sheets:kids.filter(hasSheet).length};
  }).filter(r=>r.count>0);
}
function pinFor(s){
  const on=hasSheet(s);
  const m=L.circleMarker([s.lat,s.lng],{radius:on?8:6,color:on?"#d4af37":"#6b6554",fillColor:on?"#f0d56a":"#4a463c",fillOpacity:on?.95:.7,weight:1});
  m.bindTooltip(s.name+" · "+s.cls+(on?" · Sheet":"")+(s.mi!=null?" · "+s.mi.toFixed(0)+" mi":""));
  m.on("click",()=>showSchool(s.id));
  return m;
}
function clearPins(){
  clusters.clearLayers();
  regionLayer.clearLayers();
  if(radiusCircle){ map.removeLayer(radiusCircle); radiusCircle=null; }
}

function showRegions(){
  activeRegion=null; selected=null; nearOn=false;
  document.getElementById("nearBtn").classList.remove("on");
  document.getElementById("regionsBtn").classList.add("on");
  clearPins();
  showRegionOutlines(true);
  const regs=regionStats();
  regs.forEach(r=>{
    const icon=L.divIcon({className:"",html:`<div class="region-pin">${r.count}</div>`,iconSize:[46,46],iconAnchor:[23,23]});
    const m=L.marker([r.lat,r.lng],{icon}).bindTooltip(r.name+" · "+r.count+" schools");
    m.on("click",()=>openRegion(r.name));
    regionLayer.addLayer(m);
  });
  map.setView([32.9,-83.5],7);
  document.getElementById("drawer").innerHTML=
    `<div class="kicker">GEORGIA REGIONS</div>
     <div class="count">${regs.reduce((n,r)=>n+r.count,0)} schools · ${regs.length} regions</div>`+
    regs.map(r=>`<div class="region" data-region="${esc(r.name)}"><div><div class="n">${esc(r.name)}</div><div class="sub">${r.sheets} with prospect sheets</div></div><div class="mi">${r.count}</div></div>`).join("");
}

function openRegion(name){
  activeRegion=name; selected=null;
  document.getElementById("regionsBtn").classList.remove("on");
  showRegionOutlines(false);
  const list=pool().filter(s=>s.region===name);
  if(nearOn&&here) list.sort((a,b)=>a.mi-b.mi);
  else list.sort((a,b)=>a.name.localeCompare(b.name));
  clearPins();
  list.forEach(s=>clusters.addLayer(pinFor(s)));
  if(list.length) map.fitBounds(L.latLngBounds(list.map(s=>[s.lat,s.lng])).pad(0.18));
  const withN=list.filter(hasSheet).length;
  document.getElementById("drawer").innerHTML=
    `<button class="back" type="button" data-action="regions">‹ All regions</button>
     <div class="kicker" style="margin-top:.7rem">${esc(name.toUpperCase())}</div>
     <div class="count">${list.length} school${list.length===1?"":"s"} · ${withN} with sheets</div>
     <div class="legend"><span><i class="dot yes"></i>Sheet on file</span><span><i class="dot no"></i>No sheet yet</span></div>`+
    (list.length
      ? list.map(s=>`<div class="school" data-school="${esc(s.id)}"><div><div class="n">${esc(s.name)}</div><div class="sub">${esc(s.city)} · ${esc(s.county)} · Class ${esc(s.cls)}</div></div><div class="mi">${s.mi!=null?s.mi.toFixed(0)+" mi":""}<span class="tag ${hasSheet(s)?"":"off"}">${hasSheet(s)?"SHEET":"—"}</span></div></div>`).join("")
      : `<p class="empty">No schools in this region match those filters.</p>`);
}

function showSchool(id){
  const raw=byId[id];
  if(!raw) return;
  const s=enrich(raw);
  selected=s;
  if(!activeRegion) openRegion(s.region);
  map.setView([s.lat,s.lng],Math.max(map.getZoom(),10));
  const sheetLink=hasSheet(s)
    ? `<a href="${esc(sheets[s.id])}" target="_blank" rel="noopener">Prospect sheet</a>`
    : `<span class="muted">No prospect sheet yet</span>`;
  document.getElementById("drawer").innerHTML=
    `<button class="back" type="button" data-action="region" data-region="${esc(s.region)}">‹ ${esc(s.region)}</button>
     <article class="card" style="margin-top:.7rem">
       <div class="top"><div class="mono">${esc(mono(s.name))}</div><div class="badge">${esc(s.cls)}</div></div>
       <h2 class="title">${esc(s.name)}</h2>
       <div class="muted" style="margin-bottom:.4rem">${esc(s.region)}</div>
       <div class="row"><span class="muted">HEAD COACH</span><div>${esc(s.coach)}</div></div>
       <div class="row">${esc(s.stadium)}</div>
       <div class="row">${esc(s.address)}<div class="muted">${esc(s.city)} · ${esc(s.county)} County${s.mi!=null?" · "+s.mi.toFixed(1)+" miles":""}</div></div>
       <div class="actions">
         <a href="${gmaps(s)}" target="_blank" rel="noopener">Google Maps</a>
         <a href="${amaps(s)}" target="_blank" rel="noopener">Apple Maps</a>
         ${sheetLink}
       </div>
     </article>`;
}

function apply(){
  if(nearOn&&here){
    activeRegion=null;
    showRegionOutlines(false);
    const list=pool().sort((a,b)=>a.mi-b.mi);
    clearPins();
    list.forEach(s=>clusters.addLayer(pinFor(s)));
    radiusCircle=L.circle([here.lat,here.lng],{
      radius:parseFloat(document.getElementById("radius").value)*1609.34,
      color:"#d4af37",weight:1.2,fillColor:"#d4af37",fillOpacity:.08
    }).addTo(map);
    const withN=list.filter(hasSheet).length;
    document.getElementById("drawer").innerHTML=
      `<button class="back" type="button" data-action="regions">‹ All regions</button>
       <div class="kicker" style="margin-top:.7rem">NEAR YOU · ${esc(document.getElementById("radius").value)} MILES</div>
       <div class="count">${list.length} schools · ${withN} with sheets</div>`+
      (list.map(s=>`<div class="school" data-school="${esc(s.id)}"><div><div class="n">${esc(s.name)}</div><div class="sub">${esc(s.region)} · ${esc(s.city)} · Class ${esc(s.cls)}</div></div><div class="mi">${s.mi.toFixed(0)} mi<span class="tag ${hasSheet(s)?"":"off"}">${hasSheet(s)?"SHEET":"—"}</span></div></div>`).join("")
        || '<p class="empty">No schools in that radius.</p>');
    return;
  }
  if(activeRegion) openRegion(activeRegion);
  else showRegions();
}

document.getElementById("drawer").addEventListener("click",e=>{
  const back=e.target.closest("[data-action]");
  if(back){
    if(back.dataset.action==="regions") showRegions();
    else if(back.dataset.action==="region") openRegion(back.dataset.region);
    return;
  }
  const regionEl=e.target.closest("[data-region].region");
  if(regionEl){ openRegion(regionEl.dataset.region); return; }
  const schoolEl=e.target.closest("[data-school]");
  if(schoolEl) showSchool(schoolEl.dataset.school);
});

document.getElementById("regionsBtn").onclick=()=>showRegions();
document.getElementById("nearBtn").onclick=()=>{
  if(nearOn){ nearOn=false; document.getElementById("nearBtn").classList.remove("on"); showRegions(); return; }
  if(!navigator.geolocation){ alert("Location is not available in this browser."); return; }
  navigator.geolocation.getCurrentPosition(pos=>{
    nearOn=true;
    document.getElementById("nearBtn").classList.add("on");
    document.getElementById("regionsBtn").classList.remove("on");
    here={lat:pos.coords.latitude,lng:pos.coords.longitude};
    if(youMarker) map.removeLayer(youMarker);
    youMarker=L.circleMarker([here.lat,here.lng],{radius:8,color:"#fff4c2",fillColor:"#d4af37",fillOpacity:1,weight:2}).bindTooltip("You").addTo(map);
    map.setView([here.lat,here.lng],9);
    apply();
  },()=>alert("Could not read your location. Allow location access and try again."),{enableHighAccuracy:true,timeout:10000});
};
document.getElementById("sheetBtn").onclick=()=>{
  sheetOnly=!sheetOnly;
  document.getElementById("sheetBtn").classList.toggle("on",sheetOnly);
  apply();
};
const filterBtn=document.getElementById("filterBtn"), filterBox=document.getElementById("filterBox");
filterBtn.onclick=e=>{
  e.stopPropagation();
  filterBox.classList.toggle("on");
  filterBtn.classList.toggle("on",filterBox.classList.contains("on"));
};
document.addEventListener("click",e=>{
  if(!filterBox.contains(e.target)&&e.target!==filterBtn){
    filterBox.classList.remove("on");
    filterBtn.classList.remove("on");
  }
});
["q","cls","cty","radius"].forEach(id=>{
  const el=document.getElementById(id);
  el.addEventListener(id==="q"?"input":"change",apply);
});
showRegions();
</script>
</body>
</html>
