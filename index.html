  <style>
    :root { --bg:#070907; --panel:#0c110c; --line:#d4af37; --text:#f3ead1; --muted:#9a9178; }
    * { box-sizing:border-box; margin:0; padding:0; }
    html, body { height:100%; overflow:hidden; font-family:Georgia, serif; background:var(--bg); color:var(--text); }
    header { height:68px; display:grid; grid-template-columns:auto 1fr auto; gap:1rem; align-items:center; padding:0 1.1rem; border-bottom:1px solid rgba(212,175,55,.25); }
    .logo { display:flex; align-items:center; gap:.65rem; }
    .ga { width:36px; height:36px; border:1.5px solid var(--line); border-radius:50%; display:grid; place-items:center; color:var(--line); font-size:.72rem; letter-spacing:.04em; }
    .logo h1 { font-size:.78rem; letter-spacing:.16em; color:var(--line); }
    .logo p { font-size:.62rem; letter-spacing:.08em; color:var(--muted); }
    .search-wrap { position:relative; }
    .search-wrap:before { content:"⌕"; position:absolute; left:.7rem; top:.4rem; color:var(--line); font-size:.95rem; }
    .search { width:100%; max-width:420px; background:#101510; border:1px solid rgba(212,175,55,.35); color:var(--text); padding:.5rem .7rem .5rem 2rem; font:inherit; }
    select { background:#101510; border:1px solid rgba(212,175,55,.35); color:var(--text); padding:.48rem .55rem; font:inherit; }
    .filters { display:flex; gap:.5rem; align-items:center; }
    main { height:calc(100% - 68px); display:grid; grid-template-columns:1fr 390px; }
    #map { height:100%; background:#0a0d0a; }
    .drawer { border-left:1px solid rgba(212,175,55,.22); overflow:auto; padding:1rem; background:radial-gradient(circle at 20% 0%, #162016, var(--panel) 55%); }
    .card { position:relative; border:1px solid var(--line); padding:1.15rem 1.05rem 1rem; background:linear-gradient(180deg, rgba(212,175,55,.06), transparent 28%), #0d130d; }
    .card:before, .card:after, .card-inner:before, .card-inner:after { content:""; position:absolute; width:14px; height:14px; border:1px solid var(--line); }
    .card:before { top:6px; left:6px; border-right:0; border-bottom:0; }
    .card:after { top:6px; right:6px; border-left:0; border-bottom:0; }
    .card-inner:before { bottom:6px; left:6px; border-right:0; border-top:0; }
    .card-inner:after { bottom:6px; right:6px; border-left:0; border-top:0; }
    .top { display:flex; justify-content:space-between; align-items:flex-start; gap:.7rem; }
    .mono { width:58px; height:58px; border:1px solid var(--line); display:grid; place-items:center; letter-spacing:.08em; color:var(--line); font-size:1.05rem; }
    .badge { border:1px solid var(--line); color:var(--line); font-size:.62rem; letter-spacing:.18em; padding:.28rem .45rem; }
    .kicker { margin-top:.85rem; font-size:.58rem; letter-spacing:.22em; color:var(--line); }
    .title { font-size:1.22rem; line-height:1.15; margin:.18rem 0 .55rem; }
    .row { display:grid; grid-template-columns:18px 1fr; gap:.55rem; align-items:start; margin:.38rem 0; font-size:.84rem; color:#efe6c8; }
    .row svg { width:16px; height:16px; margin-top:2px; stroke:var(--line); fill:none; stroke-width:1.6; }
    .addr-row { display:flex; justify-content:space-between; gap:.6rem; align-items:flex-end; margin-top:.15rem; }
    .dir { color:var(--line); text-decoration:none; font-size:.72rem; letter-spacing:.08em; white-space:nowrap; }
    .rule { height:1px; background:linear-gradient(90deg, transparent, var(--line), transparent); margin:1rem 0 .8rem; }
    .recruits { display:flex; align-items:center; justify-content:center; gap:.55rem; letter-spacing:.32em; font-size:.62rem; color:var(--line); }
    .slots { margin-top:.7rem; }
    .slot { border-bottom:1px dashed rgba(212,175,55,.28); padding:.42rem 0; color:var(--muted); font-size:.8rem; display:flex; gap:.45rem; }
    .slot span { color:var(--line); }
    .empty { color:var(--muted); font-size:.85rem; padding:1rem .2rem; }
    .leaflet-tooltip { background:#0d130d; color:#f3ead1; border:1px solid #d4af37; }
    .marker-cluster-small { background-color: rgba(240,213,106,.28); }
    .marker-cluster-small div { background-color: rgba(240,213,106,.85); color:#1a1608; }
    .marker-cluster-medium { background-color: rgba(212,175,55,.32); }
    .marker-cluster-medium div { background-color: rgba(212,175,55,.92); color:#1a1608; }
    .marker-cluster-large { background-color: rgba(139,105,20,.38); }
    .marker-cluster-large div { background-color: rgba(139,105,20,.95); color:#f3ead1; }
    .marker-cluster { border:1px solid rgba(212,175,55,.55); }
    .marker-cluster div { font-family:Georgia,serif; font-weight:700; }
    @media (max-width:900px) {
      main { grid-template-columns:1fr; }
      .drawer { height:46%; }
      #map { height:54%; }
      header { grid-template-columns:1fr; height:auto; padding:.7rem; }
    }
  </style>

    counties.forEach(c => {
      const o = document.createElement("option");
      o.value = c; o.textContent = c; cty.appendChild(o);
    });

    function mono(name) {
      const parts = name.replace(/[()]/g,"").split(/\s+/).filter(w => !/high|school|academy|catholic|military|county|charter|institute|comprehensive|preparatory|episcopal|christian|collegiate/i.test(w));
      const letters = parts.slice(0,2).map(w => w[0]).join("");
      return (letters || name.slice(0,2)).toUpperCase();
    }
    function mapsUrl(s) {
      return "https://www.google.com/maps/dir/?api=1&destination=" + encodeURIComponent(s.address || (s.name + " " + s.city + " GA"));
    }
    function showSchool(s) {
      document.getElementById("drawer").innerHTML = `
        <article class="card"><div class="card-inner">
          <div class="top">
            <div class="mono">${mono(s.name)}</div>
            <div class="badge">${s.cls}</div>
          </div>
          <div class="kicker">GEORGIA HIGH SCHOOL FOOTBALL</div>
          <h2 class="title">${s.name}</h2>
          <div class="row">${ICO.shield}<div><small style="letter-spacing:.16em;color:var(--line);font-size:.58rem;">HEAD COACH</small><div>${s.coach || "To be listed"}</div></div></div>
          <div class="row">${ICO.stadium}<div>${s.stadium}</div></div>
          <div class="row">${ICO.pin}<div class="addr-row"><div>${s.address}<div style="color:var(--muted);font-size:.75rem;margin-top:.15rem;">${s.city} · ${s.county} County</div></div><a class="dir" href="${mapsUrl(s)}" target="_blank" rel="noopener">Directions ›</a></div></div>
          <div class="rule"></div>
          <div class="recruits">◆ &nbsp; R E C R U I T S &nbsp; ◆</div>
          <div class="slots">
            <div class="slot"><span>◆</span> To be listed</div>
            <div class="slot"><span>◆</span> To be listed</div>
            <div class="slot"><span>◆</span> To be listed</div>
          </div>
        </div></article>`;
    }

    const map = L.map("map", { zoomControl:true }).setView([32.9, -83.5], 7);
    L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
      attribution: "&copy; OpenStreetMap &copy; CARTO", maxZoom: 19
    }).addTo(map);
    fetch("https://raw.githubusercontent.com/johan/world.geo.json/master/countries/USA/GA.geo.json")
      .then(r => r.json())
      .then(geo => L.geoJSON(geo, { interactive:false, style:{ color:"#d4af37", weight:1.6, fillColor:"#2a332a", fillOpacity:0.35 } }).addTo(map));

    const clusters = L.markerClusterGroup({ showCoverageOnHover:false, maxClusterRadius:48 });
    function pinFor(s) {
      const m = L.circleMarker([s.lat, s.lng], { radius:6, color:"#d4af37", fillColor:"#f0d56a", fillOpacity:0.95, weight:1 });
      m.bindTooltip(s.name + " · " + s.cls);
      m.on("click", () => { showSchool(s); map.setView([s.lat, s.lng], Math.max(map.getZoom(), 10)); });
      return m;
    }
    function render(list) {
      clusters.clearLayers();
      list.forEach(s => clusters.addLayer(pinFor(s)));
      if (!list.length) document.getElementById("drawer").innerHTML = `<p class="empty">No schools match those filters.</p>`;
    }
    map.addLayer(clusters);
    render(schools);
    showSchool(schools.find(s => s.name.startsWith("Mountain View")) || schools[0]);

    function applyFilters() {
      const q = document.getElementById("q").value.toLowerCase();
      const cl = document.getElementById("cls").value;
      const co = document.getElementById("cty").value;
      render(schools.filter(s =>
        (!q || s.name.toLowerCase().includes(q) || s.city.toLowerCase().includes(q) || s.county.toLowerCase().includes(q)) &&
        (!cl || s.cls === cl) &&
        (!co || s.county === co)
      ));
    }
    document.getElementById("q").addEventListener("input", applyFilters);
    document.getElementById("cls").addEventListener("change", applyFilters);
    document.getElementById("cty").addEventListener("change", applyFilters);
  </script>
</body>
</html>
